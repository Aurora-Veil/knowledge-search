services:
  setup:
    build:
      context: ./docker
      args:
        ES_VERSION: "9.5.3"
    container_name: knowledge-es-setup
    user: "0"
    working_dir: /usr/share/elasticsearch
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./docker/instances.yml:/usr/share/elasticsearch/config/instances.yml:ro
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
    command: >-
      bash -c '
        if [ x$${ELASTIC_PASSWORD} == x ]; then
          echo "ELASTIC_PASSWORD is empty - set it in .env";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip -in config/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions";
        chown -R root:root config/certs;
        find config/certs -type d -exec chmod 750 \{\} \;;
        find config/certs -type f -exec chmod 640 \{\} \;;
        echo "All done!";
      '
    restart: "no"

  es01:
    depends_on:
      setup:
        # 不能用 service_healthy：setup 是"跑完就退出"的一次性容器，
        # 证书已存在时它秒退，而 healthcheck 的第一次检查要等 interval 才跑，
        # 结果是 exited(0) + Health=unhealthy + Checks=0，
        # 报 "dependency failed to start: container ... exited (0)"。
        # service_completed_successfully 只等退出码 0，正是一次性容器该用的条件。
        condition: service_completed_successfully
    build:
      context: ./docker
      args:
        ES_VERSION: "9.5.3"
    container_name: knowledge-es01
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./data/es01:/usr/share/elasticsearch/data
      - ./docker/es01.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - es-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  es02:
    build:
      context: ./docker
      args:
        ES_VERSION: "9.5.3"
    container_name: knowledge-es02
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./data/es02:/usr/share/elasticsearch/data
      - ./docker/es02.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - es-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  es03:
    build:
      context: ./docker
      args:
        ES_VERSION: "9.5.3"
    container_name: knowledge-es03
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./data/es03:/usr/share/elasticsearch/data
      - ./docker/es03.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - es-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  es-net:
    external: true

volumes:
  certs:
    driver: local

