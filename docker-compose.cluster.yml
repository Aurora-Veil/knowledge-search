services:
  setup:
    image: elasticsearch-ik:9.5.3
    build:
      context: ./docker
      args:
        ES_VERSION: "9.5.3"
    container_name: es-setup
    user: "0"
    working_dir: /usr/share/elasticsearch
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./docker/instances.yml:/usr/share/elasticsearch/config/instances.yml:ro
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
    command: >-
      bash -c '
        if [ x$${ELASTIC_PASSWORD} == x ]; then
          echo "ELASTIC_PASSWORD is empty - set it in .env";
          exit 1;
        fi;
        if [ x$${KIBANA_PASSWORD} == x ]; then
          echo "KIBANA_PASSWORD is empty - set it in .env";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip -in config/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions";
        chown -R root:root config/certs;
        find config/certs -type d -exec chmod 750 \{\} \;;
        find config/certs -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s http://es01:9200 | grep -q "missing authentication credentials"; do sleep 10; done;
        echo "Setting kibana_system password";
        until curl -s -X POST -u "elastic:$${ELASTIC_PASSWORD}" -H "Content-Type: application/json" http://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 5; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120
    restart: "no"

  es01:
    image: elasticsearch-ik:9.5.3
    container_name: es01
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - ${ES_PORT:-9200}:9200
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./data/es01:/usr/share/elasticsearch/data
      - ./docker/es01.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  es02:
    image: elasticsearch-ik:9.5.3
    container_name: es02
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./data/es02:/usr/share/elasticsearch/data
      - ./docker/es02.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  es03:
    image: elasticsearch-ik:9.5.3
    container_name: es03
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ES_ELASTIC_PASSWORD:?set ES_ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./data/es03:/usr/share/elasticsearch/data
      - ./docker/es03.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: kibana
    restart: unless-stopped
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    ports:
      - ${KIBANA_PORT:-5601}:5601
    volumes:
      - ./docker/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./data/kibana:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -I http://localhost:5601 | grep -q ' 302' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  certs:
    driver: local
