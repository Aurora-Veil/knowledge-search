<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的搜索记录</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>

  <header class="topbar">
    <h1 class="brand">我的搜索记录</h1>
    <a class="nav-link" href="/ui/">首页</a>
    <a class="nav-link" href="/ui/oirf.html">OIRF 检索</a>
    <a class="nav-link" href="/ui/report.html">报告检索</a>
    <div id="userBox" class="user-box"></div>
  </header>

  <main class="history-wrap">

    <div class="history-bar">
      <select id="kind" class="layout" aria-label="搜索类型">
        <option value="">全部类型</option>
        <option value="oirf">OIRF 检索</option>
        <option value="report">报告检索</option>
      </select>

      <select id="limit" class="layout" aria-label="条数">
        <option value="20">最近 20 条</option>
        <option value="50">最近 50 条</option>
        <option value="100">最近 100 条</option>
      </select>

      <button id="reload" class="submit" type="button">刷新</button>
    </div>

    <div id="historyStatus" class="status" hidden></div>

    <!-- 库里存的是**检索条件**不是检索结果：结果可以重放，存下来体积会爆
         而且会过期（知识库在更新）。所以这张表列的是「当时搜了什么」。 -->
    <table id="historyTable" class="history-table" hidden>
      <thead>
        <tr>
          <th class="col-time">时间</th>
          <th class="col-kind">类型</th>
          <th class="col-query">检索词</th>
          <th class="col-filters">筛选条件</th>
          <th class="col-num">页码</th>
          <th class="col-num">命中</th>
          <th class="col-num">耗时</th>
          <th class="col-go"></th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>

    <p class="history-note">
      「重搜」只带得走表单上有的字段（检索词 / 类型 / 匹配方式 / 版式）。
      库里可能记着更细的筛选条件（地区、行业、发布时间…），那些照原样列在
      「筛选条件」一列里 —— 页面上没有对应控件，所以重搜不会复原它们。
      「命中」后面带 * 表示这个数字只是词法分支的命中数，可能小于实际返回条数。
    </p>

  </main>

  <script src="/ui/auth.js" defer></script>
  <script src="/ui/history.js" defer></script>
</body>
</html>
