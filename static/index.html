<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>knowledge-search</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body class="home">

  <main class="home-wrap">

    <!-- 首页本身是公开的（未登录也能看有哪些入口），
         但两个检索页和搜索记录页都要求登录 —— 点进去才被送到登录页，
         登录完用 ?next= 跳回原来要去的页面。
         auth.js 的 mountUser() 会按登录与否填这里：登录 → 用户名/我的搜索/退出，
         未登录 → 一个「登录」链接。 -->
    <div class="home-top">
      <div id="userBox" class="user-box"></div>
    </div>

    <h1 class="home-title">knowledge-search</h1>
    <p class="home-sub">OIRF 知识图谱检索服务</p>

    <!-- 三个入口。页面都是纯 HTML/CSS/JS，没有构建步骤 -->
    <div class="entries">

      <a class="entry" href="/ui/report.html">
        <div class="entry-name">报告检索</div>
        <div class="entry-desc">
          用一句话描述你要找的报告，按语义匹配标题；点开看摘要与原文链接。
        </div>
        <div class="entry-meta">POST /api/v1/reports/search</div>
      </a>

      <a class="entry" href="/ui/oirf.html">
        <div class="entry-name">OIRF 检索</div>
        <div class="entry-desc">
          检索 source / evidence / viewpoint 三类对象，词法与向量融合排序；
          点开看对象全文，也能留空检索词按类型浏览。
        </div>
        <div class="entry-meta">POST /api/v1/search</div>
      </a>

      <a class="entry entry-wide" href="/ui/history.html">
        <div class="entry-name">我的搜索记录</div>
        <div class="entry-desc">
          登录后每次检索都会记一条：检索词、筛选条件、页码、命中数与耗时。
          可以一键用同样的条件重搜。
        </div>
        <div class="entry-meta">GET /api/v1/history</div>
      </a>

    </div>

    <p class="home-foot">
      <a class="nav-link" href="/docs">接口文档 /docs</a>
    </p>
  </main>

  <!-- 首页只用到 mountUser()，没有别的依赖 -->
  <script src="/ui/auth.js" defer></script>
  <script src="/ui/index.js" defer></script>

</body>
</html>
