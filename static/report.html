<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报告检索</title>
  <!-- 注意：这里的路径以 /ui 开头（绝对路径）。
       页面挂在 /ui 下，用相对路径 "style.css" 会被浏览器解析成 /style.css，取不到。 -->
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>

  <!-- 顶栏：标题 + 检索表单。form 的好处是按回车自动提交（触发 submit 事件） -->
  <header class="topbar">
    <h1 class="brand">报告检索</h1>
    <a class="nav-link" href="/ui/">首页</a>
    <a class="nav-link" href="/ui/oirf.html">OIRF 检索 →</a>

    <form id="searchForm" class="searchbar" autocomplete="off">
      <input id="q" class="q" type="search"
             placeholder="用一句话描述你想要的报告，例如：工业机器人应用场景"
             aria-label="检索词">

      <!-- 版式只有两个取值（横版 / 竖版）。传别的值接口不会报错，只会返回 0 条，
           所以这里用下拉框而不是输入框。 -->
      <select id="layout" class="layout" aria-label="版式">
        <option value="">全部版式</option>
        <option value="横版">横版</option>
        <option value="竖版">竖版</option>
      </select>

      <select id="mode" class="layout" aria-label="匹配方式">
        <option value="or">任一匹配</option>
        <option value="and">全部匹配</option>
        <option value="phrase">短语匹配</option>
      </select>

      <!-- 发布时间。默认「全部时间」，也就是不加任何日期过滤。
           相对范围按今天算，年份范围按自然年算；后端只认 YYYY-MM-DD，
           拼日期的事在 report.js 的 periodRange() 里。
           年份列表按库里现有的数据写的（2018-03 ~ 2026-08），
           以后入了新一年的数据，这里补一个 option 即可。 -->
      <select id="period" class="layout" aria-label="发布时间">
        <option value="">全部时间</option>
        <option value="1y">近一年</option>
        <option value="3y">近三年</option>
        <option value="5y">近五年</option>
        <optgroup label="按年份">
          <option value="2026">2026 年</option>
          <option value="2025">2025 年</option>
          <option value="2024">2024 年</option>
          <option value="2023">2023 年</option>
          <option value="2022">2022 年</option>
          <option value="2021">2021 年</option>
          <option value="2020">2020 年</option>
          <option value="2019">2019 年</option>
          <option value="2018">2018 年</option>
        </optgroup>
      </select>

      <!-- 时间衰减权重。默认「不衰减」= 不发 time_weight，和后端加这个参数之前的行为一致。
           值越大越偏向新报告（半衰期 1 年、前 3 个月免罚），细节见 app/search/time_decay.py。 -->
      <select id="decay" class="layout" aria-label="时间权重">
        <option value="">不衰减</option>
        <option value="0.1">略偏新</option>
        <option value="0.2">偏新</option>
        <option value="0.35">更偏新</option>
      </select>

      <button id="submit" class="submit" type="submit">搜索</button>
    </form>

    <!-- 用户名 / 我的搜索 / 退出，由 auth.js 的 mountUser() 填 -->
    <div id="userBox" class="user-box"></div>
  </header>

  <!-- 左右两栏：左列表、右详情 -->
  <main class="panes">

    <section class="pane list-pane">
      <!-- 状态条：检索中 / 无结果 / 出错，都显示在这里 -->
      <div id="listStatus" class="status" hidden></div>
      <ul id="results" class="results"></ul>

      <!-- 翻页条。接口的 total 只是词法分支的命中数（可能小于返回条数），
           所以有没有下一页仍然靠「这一页装满了没有」判断。
           后端 RESULT_WINDOW = 200，page * size 超过 200 会返回 400，
           size=20 时最多翻到第 10 页。 -->
      <div id="pager" class="pager" hidden>
        <button id="prevPage" class="page-btn" type="button">上一页</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="nextPage" class="page-btn" type="button">下一页</button>
      </div>
    </section>

    <section class="pane detail-pane">
      <div id="detail" class="detail">
        <p class="placeholder">在左侧点一条报告，这里显示详情。</p>
      </div>
    </section>

  </main>

  <!-- defer = 等 HTML 解析完再执行，所以脚本里可以直接 getElementById。
       顺序不能反：report.js 用 auth.js 提供的 apiFetch / requireLogin -->
  <script src="/ui/auth.js" defer></script>
  <script src="/ui/report.js" defer></script>
</body>
</html>
